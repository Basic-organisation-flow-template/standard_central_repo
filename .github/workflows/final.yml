name: Build and Version
on:
  workflow_call:
    outputs:
      full_semver:
        description: 'The full semantic version generated by GitVersion'
        value: ${{ jobs.version.outputs.full_semver }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs: # This is required
      full_semver: ${{ steps.gitversion.outputs.fullSemVer }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial for GitVersion to see full history
          set-safe-directory: true 


      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4 # Automatically uses latest version
        with:
          versionSpec: '6.4.0' # Or use `latest` to ensure you always use the newest version
      
      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          useConfigFile: true
          versionSpec: '6.4.0'
      
      - name: Display calculated version
        run: |
          echo "Full SemVer: ${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Save version to a file
        run: echo "${{ steps.gitversion.outputs.fullSemVer }}" > VERSION.txt

      # - name: Upload VERSION.txt as an artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: version-artifact
      #     path: VERSION.txt
      #     retention-days: 1

      - name: Create and push git tag
        run: |
          GIT_AUTHOR_NAME="$(git log -1 --pretty=format:'%an')"
          GIT_AUTHOR_EMAIL="$(git log -1 --pretty=format:'%ae')"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git tag "v${{ steps.gitversion.outputs.fullSemVer }}"
          git push origin "v${{ steps.gitversion.outputs.fullSemVer }}"
