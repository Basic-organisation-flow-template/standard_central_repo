name: Build and Version
on:
  workflow_call:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial for GitVersion to see full history
          set-safe-directory: true 

      # This new step prevents Git security errors that can interfere with GitVersion
      - name: Set Git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"


      - name: Install and Execute GitVersion
        id: gitversion
        run: |
          # Install GitVersion as a global tool
          dotnet tool install --global GitVersion.Tool --version 6.4.0

          # Add the global tool path to the PATH environment variable
          # The location is typically $HOME/.dotnet/tools on Linux runners
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

          # Execute the GitVersion tool with your configuration
          VERSION_OUTPUT=$(dotnet-gitversion --roll-forward Major /home/runner/work/child_repo_1/child_repo_1 /output json /l console)

          # Parse outputs and set them for subsequent steps
          # jq is a tool for processing JSON data, which is available on GitHub runners
          echo "$VERSION_OUTPUT" | jq -r '.FullSemVer' | xargs -I {} echo "fullSemVer={}" >> $GITHUB_OUTPUT
          echo "$VERSION_OUTPUT" | jq -r '.MajorMinorPatch' | xargs -I {} echo "majorMinorPatch={}" >> $GITHUB_OUTPUT
          echo "$VERSION_OUTPUT" | jq -r '.PreReleaseTagWithDash' | xargs -I {} echo "preReleaseTagWithDash={}" >> $GITHUB_OUTPUT


      # - name: Install GitVersion
      #   uses: gittools/actions/gitversion/setup@v4 # Automatically uses latest version
      #   with:
      #     versionSpec: '6.4.0' # Or use `latest` to ensure you always use the newest version
      
      # - name: Execute GitVersion
      #   id: gitversion
      #   uses: gittools/actions/gitversion/execute@v4
      #   with:
      #     useConfigFile: true
      #     versionSpec: '6.4.0'
      
      - name: Display calculated version
        run: |
          echo "Full SemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Major.Minor.Patch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "Pre-release tag: ${{ steps.gitversion.outputs.preReleaseTagWithDash }}"

      # Example of how to use the version in a build step
      - name: Build with version
        run: dotnet build --configuration Release /p:Version=${{ steps.gitversion.outputs.fullSemVer }}